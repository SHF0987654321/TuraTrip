name: Deploy TuraTrip to VPS

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ghcr.io/${{ github.repository_owner }}/turatrip-backend:latest
  IMAGE_FRONTEND: ghcr.io/${{ github.repository_owner }}/turatrip-frontend:latest

jobs:
  # -----------------------------------------------------------------
  # JOB 1: Compilaciones pesadas ejecutadas en los runners de GitHub
  # -----------------------------------------------------------------
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Iniciar sesión en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compilar y publicar imagen del Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ env.IMAGE_BACKEND }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Compilar y publicar imagen del Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ env.IMAGE_FRONTEND }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.API_URL }}
            INTERNAL_BACKEND_URL=http://backend:8080
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -----------------------------------------------------------------
  # JOB 2: Despliegue liviano en el VPS (SÓLO PULL Y ARRANQUE RÁPIDO)
  # -----------------------------------------------------------------
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Copiar docker-compose al VPS vía SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "docker-compose.prod.yml"
          target: "/var/www/seminario1/turatrip"

      - name: Desplegar en el VPS por SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /var/www/seminario1/turatrip

            # Crear el archivo .env sin procesar variables localmente
            cat <<'EOF' > .env
            DB_ROOT_PASSWORD="${{ secrets.DB_ROOT_PASSWORD }}"
            DB_NAME="${{ secrets.DB_NAME }}"
            DB_URL="${{ secrets.DB_URL }}"
            DB_USERNAME="${{ secrets.DB_USERNAME }}"
            DB_PASSWORD="${{ secrets.DB_PASSWORD }}"
            JWT_SECRET="${{ secrets.JWT_SECRET }}"
            JWT_EXPIRATION_MS="${{ secrets.JWT_EXPIRATION_MS }}"
            API_URL="${{ secrets.API_URL }}"
            FRONTEND_URL="${{ secrets.FRONTEND_URL }}"
            SMTP_HOST="${{ secrets.SMTP_HOST }}"
            SMTP_PORT="${{ secrets.SMTP_PORT }}"
            SMTP_USERNAME="${{ secrets.SMTP_USERNAME }}"
            SMTP_PASSWORD="${{ secrets.SMTP_PASSWORD }}"
            UPLOADS_DIR="${{ secrets.UPLOADS_DIR }}"
            MAX_FILE_SIZE="${{ secrets.MAX_FILE_SIZE }}"
            MAX_REQUEST_SIZE="${{ secrets.MAX_REQUEST_SIZE }}"
            IMAGE_BACKEND=ghcr.io/${{ github.repository_owner }}/turatrip-backend:latest
            IMAGE_FRONTEND=ghcr.io/${{ github.repository_owner }}/turatrip-frontend:latest
            EOF

            chmod 600 .env

            # Detectar el socket de Docker (Rootless o estándar)
            if [ -S "/run/user/$(id -u)/docker.sock" ]; then
              export DOCKER_HOST="unix:///run/user/$(id -u)/docker.sock"
            elif [ -S "$HOME/.docker/run/docker.sock" ]; then
              export DOCKER_HOST="unix://$HOME/.docker/run/docker.sock"
            fi

            # Iniciar sesión en el registro para descargar las imágenes creadas
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Descargar imágenes y reiniciar contenedores rápidamente
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml down
            docker compose -f docker-compose.prod.yml up -d

            # Limpiar imágenes antiguas
            docker image prune -f
