name: Deploy TuraTrip to VPS

on:
  push:
    branches:
      - main

jobs:
  # -----------------------------------------------------------------
  # JOB 1: Compilaciones pesadas ejecutadas en los runners de GitHub
  # -----------------------------------------------------------------
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      owner_lowercase: ${{ steps.prep.outputs.owner_lowercase }}
      image_backend: ${{ steps.prep.outputs.image_backend }}
      image_frontend: ${{ steps.prep.outputs.image_frontend }}

    steps:
      - name: Checkout del código
        uses: actions/checkout@v5

      - name: Preparar nombres de imágenes en minúsculas
        id: prep
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner_lowercase=${OWNER}" >> $GITHUB_OUTPUT
          echo "image_backend=ghcr.io/${OWNER}/turatrip-backend:latest" >> $GITHUB_OUTPUT
          echo "image_frontend=ghcr.io/${OWNER}/turatrip-frontend:latest" >> $GITHUB_OUTPUT

      - name: Iniciar sesión en GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Compilar y publicar imagen del Backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.prep.outputs.image_backend }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Compilar y publicar imagen del Frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.prep.outputs.image_frontend }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.API_URL }}
            INTERNAL_BACKEND_URL=http://backend:8080
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -----------------------------------------------------------------
  # JOB 2: Despliegue en el VPS
  # -----------------------------------------------------------------
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v5

      - name: Copiar docker-compose al VPS vía SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "docker-compose.prod.yml"
          target: "/var/www/seminario1/turatrip"

      - name: Desplegar en el VPS por SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DB_ROOT_PASSWORD: ${{ secrets.DB_ROOT_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_DRIVER: ${{ secrets.DB_DRIVER }}
          HIBERNATE_DIALECT: ${{ secrets.HIBERNATE_DIALECT }}
          JPA_DDL_AUTO: ${{ secrets.JPA_DDL_AUTO || 'validate' }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRATION_MS: ${{ secrets.JWT_EXPIRATION_MS }}
          API_URL: ${{ secrets.API_URL }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          UPLOADS_DIR: ${{ secrets.UPLOADS_DIR }}
          MAX_FILE_SIZE: ${{ secrets.MAX_FILE_SIZE }}
          MAX_REQUEST_SIZE: ${{ secrets.MAX_REQUEST_SIZE }}
          IMAGE_BACKEND: ${{ needs.build-and-push.outputs.image_backend }}
          IMAGE_FRONTEND: ${{ needs.build-and-push.outputs.image_frontend }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: DB_ROOT_PASSWORD,DB_NAME,DB_URL,DB_USERNAME,DB_PASSWORD,DB_DRIVER,HIBERNATE_DIALECT,JPA_DDL_AUTO,JWT_SECRET,JWT_EXPIRATION_MS,API_URL,FRONTEND_URL,SMTP_HOST,SMTP_PORT,SMTP_USERNAME,SMTP_PASSWORD,UPLOADS_DIR,MAX_FILE_SIZE,MAX_REQUEST_SIZE,IMAGE_BACKEND,IMAGE_FRONTEND
          script: |
            cd /var/www/seminario1/turatrip

            # Configurar entorno de Docker Rootless
            export XDG_RUNTIME_DIR="/run/user/$(id -u)"
            if [ -S "$XDG_RUNTIME_DIR/docker.sock" ]; then
              export DOCKER_HOST="unix://$XDG_RUNTIME_DIR/docker.sock"
            elif [ -S "$HOME/.docker/run/docker.sock" ]; then
              export DOCKER_HOST="unix://$HOME/.docker/run/docker.sock"
            fi

            echo "=== 1. GENERANDO ARCHIVO .ENV SEGURO Y CLEAN ==="
            python3 -c "
            import os

            vars_list = [
                'COMPOSE_FILE', 'DB_ROOT_PASSWORD', 'DB_NAME', 'DB_URL', 'DB_USERNAME',
                'DB_PASSWORD', 'DB_DRIVER', 'HIBERNATE_DIALECT', 'JPA_DDL_AUTO',
                'JWT_SECRET', 'JWT_EXPIRATION_MS', 'API_URL', 'FRONTEND_URL',
                'SMTP_HOST', 'SMTP_PORT', 'SMTP_USERNAME', 'SMTP_PASSWORD',
                'UPLOADS_DIR', 'MAX_FILE_SIZE', 'MAX_REQUEST_SIZE',
                'IMAGE_BACKEND', 'IMAGE_FRONTEND'
            ]

            os.environ['COMPOSE_FILE'] = 'docker-compose.prod.yml'

            with open('.env', 'w') as f:
               for v in vars_list:
                    val = os.environ.get(v, '').replace('\r', '').replace('\n', '').strip()
                    val_clean = val.replace(\"'\", \"'\\\\''\")
                    f.write(f'{v}=\'{val_clean}\'\n')
            "
            chmod 600 .env
            set -a; source .env; set +a

            echo "=== 2. DETENCIÓN Y LIMPIEZA SEGURA ==="
            docker compose down -t 15 --remove-orphans || true
            docker rm -f \
              turatrip-db-prod \
              turatrip-backend-prod \
              turatrip-frontend-prod \
              2>/dev/null || true

            echo "=== 3. LOGIN EN GHCR Y DESCARGA DE IMÁGENES ==="
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
              -u ${{ github.actor }} \
              --password-stdin

            docker compose pull

            echo "=== 4. LEVANTANDO BASE DE DATOS PRIMERO ==="
            if ! docker compose up -d db; then
              echo "=== ERROR AL LEVANTAR LA BASE DE DATOS ==="
              docker compose logs db --tail=100
              exit 1
            fi

            echo "Esperando a que MySQL esté saludable..."
            for i in $(seq 1 30); do
              status=$(docker inspect --format='{{.State.Health.Status}}' turatrip-db-prod 2>/dev/null || echo "starting")
              if [ "$status" = "healthy" ]; then
                echo "MySQL está healthy."
                break
              fi
              sleep 2
            done

            echo "=== 5. SINCRONIZANDO CREDENCIALES DE APLICACIÓN ==="
            # Usa MYSQL_PWD por variable de entorno para no exponer el password en la línea de comandos
            docker exec -e MYSQL_PWD="$DB_ROOT_PASSWORD" -i turatrip-db-prod \
              mysql -uroot <<SQL
            ALTER USER IF EXISTS '${DB_USERNAME}'@'%' IDENTIFIED BY '${DB_PASSWORD}';
            FLUSH PRIVILEGES;
            SQL

            echo "=== 6. DESPLIEGUE COMPLETO ==="
            if ! docker compose up -d --remove-orphans; then
              echo "=== ERROR AL LEVANTAR LOS CONTENEDORES ==="
              docker compose logs --tail=100
              exit 1
            fi

            echo "=== 7. LIMPIEZA DE IMÁGENES SIN USO ==="
            docker image prune -f

            echo "=== 8. CERRANDO SESIÓN EN GHCR ==="
            docker logout ghcr.io

            echo "=== DESPLIEGUE COMPLETADO ==="
